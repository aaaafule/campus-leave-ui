<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="format-detection" content="telephone=no,address=no,email=no,date=no" />
<title>请假</title>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./mobile.css" />
</head>
<body>
<!-- 手机运行版：无模拟外壳、无状态栏/浏览器栏，只留页面主体 -->
<div id="app">
  <div id="stage">

    <main class="page" id="page">

      <section class="hero" id="hero">
        <img class="hero__img" src="./img/hero_top.png" alt="审批已通过 正在休假中" />
        <div class="hero__txt">
          <div class="hero__top">
            <span class="hero__ok"><svg class="okico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#fff"/><path d="M3.77 7.58 6.90 10.30 11.98 6.14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="butt" stroke-linejoin="round"/></svg>审批已通过</span>
            <span class="hero__link">个人信息 <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg></span>
          </div>
          <h1 class="hero__big" id="heroBig">正在休假中</h1>
        </div>
        <div class="hero__stripes"></div>
        <span class="hero__clock" id="clock">当前时间:2026-11-15 02:34:04</span>
      </section>

      <section class="who">
        <div class="avatar" id="avatar"></div>
        <div class="who__meta">
          <div class="who__name ed" id="whoName" contenteditable="true" spellcheck="false" data-field="name" data-empty="姓名"></div>
          <div class="who__no ed" id="whoNo" contenteditable="true" spellcheck="false" data-field="no" data-empty="性别学号"></div>
        </div>
      </section>

      <section class="fact">
        <div class="fact__row fact__row--2">
          <span><em>请假类型：</em>事假</span>
          <span><em>需要离校：</em>否</span>
        </div>
        <div class="fact__row"><em>销假规则：</em><b class="warn">离校请假需要销假，非离校请假无需销假</b></div>
        <div class="fact__row"><em>实际休假时间：</em>-</div>
      </section>

      <section class="card" id="card">
        <h2 class="card__t">我的 请假申请</h2>
        <div class="kv"><em>开始时间：</em><b id="startAt">11-13 15:09</b></div>
        <div class="kv"><em>结束时间：</em><b id="endAt">11-16 07:00</b></div>
        <div class="kv"><em>审批流程：</em><span id="flow">共1步</span><a class="lnk">查看<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M9 5l7 7-7 7"/></svg></a></div>
        <div class="kv"><em>审批人：</em><span id="approver"></span></div>
        <div class="kv"><em>请假原因：</em><span id="reason"></span></div>
        <div class="kv"><em>发起位置：</em><a class="lnk" id="loc"></a></div>
        <div class="kv"><em>抄送人：</em>无</div>
        <div class="kv"><em>宿舍信息：</em>-</div>

        <span class="dur" id="dur">2天15小时51分钟</span>
        <img class="seal" id="seal" src="./img/seal.jpg" alt="审批通过" />
      </section>

      <div class="tail"></div>
    </main>

    <button class="help" id="help">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">
        <path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="2.6" y="12.6" width="3.6" height="5.4" rx="1.8"/><rect x="17.8" y="12.6" width="3.6" height="5.4" rx="1.8"/><path d="M20 18v.6a2.4 2.4 0 0 1-2.4 2.4H13"/>
      </svg>
      <span>智能客服</span>
    </button>

    <div class="sheet-mask" id="sheetMask" hidden></div>
    <div class="sheet" id="sheet">
      <div class="sheet__hd">
        <strong>审批流程</strong>
        <button class="sheet__x" id="sheetX">关闭</button>
      </div>
      <ol class="steps" id="steps">
        <li class="step step--done">
          <span class="step__dot"></span>
          <div class="step__b"><div class="step__t">发起申请<b id="stApplicant"></b></div><div class="step__d" id="stApplyAt"></div></div>
        </li>
        <li class="step step--done">
          <span class="step__dot"></span>
          <div class="step__b"><div class="step__t">辅导员审批<b id="stApprover"></b></div><div class="step__d">同意 · 审批通过</div></div>
        </li>
      </ol>
    </div>

  </div>
</div>
<script src="./app.js"></script>
<script src="./mobile.js"></script>
<script src="./splash.js"></script>
</body>
</html>
